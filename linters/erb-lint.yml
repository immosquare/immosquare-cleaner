EnableDefaultLinters: true
linters:
  NoJavascriptTagHelper:
    enabled: false
  SpaceInHtmlTag:
    enabled: false
  ##============================================================##
  ## "module" is the standard type of ES module scripts (Vite,
  ## importmap) — erb_lint only allows text/javascript by default
  ##============================================================##
  AllowedScriptType:
    enabled: true
    allowed_types:
      - text/javascript
      - module
  CustomSingleLineIfModifier:
    enabled: true
  CustomHtmlToContentTag:
    enabled: true
  CustomAlignConsecutiveCalls:
    enabled: true
    methods:
      - link_to
  Rubocop:
    enabled: true
    rubocop_config:
      inherit_from:
        - linters/rubocop.yml
      Layout/TrailingWhitespace:
        Enabled: false
